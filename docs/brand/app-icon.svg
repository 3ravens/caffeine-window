<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <!-- Source of truth for the launcher icon. 108x108 is the adaptive-icon canvas;
       the glyph stays inside the 66-unit safe circle centred at (54,54).
       Mirrored in androidApp/src/main/res/drawable/ic_launcher_foreground.xml. -->
  <rect width="108" height="108" fill="#BE7A3D"/>
  <g fill="none" stroke="#EDE2C4" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- steam rising out of the cup and curling into the clock face -->
    <path d="M47,60 C47,53.5 42.5,49.4 39.5,46.4 A12,12 0 1,1 51.1,49.5"/>
    <!-- clock hands -->
    <path d="M48,37.9 V30.2 M48,37.9 L53.8,43.7"/>
    <!-- handle -->
    <circle cx="71" cy="68.5" r="6"/>
  </g>
  <!-- cup -->
  <path fill="#EDE2C4" d="M28.8,60 H67.2 C67.2,72.5 59,82.1 48,82.1 C37,82.1 28.8,72.5 28.8,60 Z"/>
</svg>
